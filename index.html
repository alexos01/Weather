<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Pro Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- THEME ENGINE --- */
        :root { --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        [data-theme="aurora"] {
            --bg-primary: #0f172a; --bg-secondary: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.7); --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.2);
            --glass-blur: 16px;
        }
        [data-theme="solar"] {
            --bg-primary: #f1f5f9; --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.9); --card-border: rgba(0, 0, 0, 0.05);
            --text-primary: #0f172a; --text-secondary: #64748b;
            --accent: #f59e0b; --accent-glow: rgba(245, 158, 11, 0.15);
            --glass-blur: 20px;
        }
        [data-theme="obsidian"] {
            --bg-primary: #000000; --bg-secondary: #0a0a0a;
            --card-bg: #121212; --card-border: #262626;
            --text-primary: #ffffff; --text-secondary: #a3a3a3;
            --accent: #a78bfa; --accent-glow: rgba(167, 139, 250, 0.2);
            --glass-blur: 0px;
        }
        [data-theme="neon"] {
            --bg-primary: #020617; --bg-secondary: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.8); --card-border: rgba(236, 72, 153, 0.3);
            --text-primary: #fdf4ff; --text-secondary: #d8b4fe;
            --accent: #ec4899; --accent-glow: rgba(236, 72, 153, 0.3);
            --glass-blur: 12px;
        }

        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; transition: background-color var(--transition), color var(--transition);
            display: flex; justify-content: center; padding: 20px;
        }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

        /* --- TOP CONTROLS --- */
        .controls { display: flex; gap: 10px; align-items: center; }
        .search-box {
            flex: 1; display: flex; align-items: center; background: var(--card-bg);
            border: 1px solid var(--card-border); border-radius: 14px; padding: 0 16px;
            backdrop-filter: blur(var(--glass-blur)); transition: all var(--transition);
        }
        .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .search-box input {
            flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary);
            font-size: 15px; padding: 14px 0; font-family: inherit;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        
        .icon-btn {
            width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--card-border);
            background: var(--card-bg); color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(var(--glass-blur)); transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px); }
        .icon-btn svg { width: 20px; height: 20px; }

        /* --- BENTO GRID --- */
        .bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px;
            padding: 20px; backdrop-filter: blur(var(--glass-blur)); transition: all var(--transition);
            position: relative; overflow: hidden;
        }
        
        .card-hero { grid-column: span 4; min-height: 280px; display: flex; flex-direction: column; justify-content: flex-end; padding: 0; }
        .card-detail { grid-column: span 2; min-height: 160px; display: flex; flex-direction: column; }
        .card-hourly { grid-column: span 4; }

        /* --- HERO CARD --- */
        .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 0.8s ease; z-index: 0; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.4) 100%); z-index: 1; }
        .hero-content { position: relative; z-index: 2; padding: 24px; color: #fff; }
        .hero-location { font-size: 22px; font-weight: 600; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .hero-date { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 16px; }
        .hero-temp-row { display: flex; align-items: center; gap: 16px; }
        .hero-temp { font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -2px; }
        .hero-info { display: flex; flex-direction: column; gap: 4px; }
        .hero-condition { font-size: 18px; font-weight: 500; }
        .hero-feels { font-size: 14px; color: rgba(255,255,255,0.8); }
        
        .unit-toggle {
            position: absolute; top: 20px; right: 20px; z-index: 3;
            display: flex; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 4px; backdrop-filter: blur(8px);
        }
        .unit-btn {
            padding: 6px 14px; border-radius: 16px; border: none; background: transparent;
            color: rgba(255,255,255,0.7); font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s;
        }
        .unit-btn.active { background: #fff; color: #000; }

        /* --- DETAIL CARDS --- */
        .detail-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--text-secondary); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-header svg { width: 16px; height: 16px; color: var(--accent); }
        .detail-value { font-size: 28px; font-weight: 600; color: var(--text-primary); }
        .detail-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        /* --- NEW VISUAL WIND GAUGE --- */
        .wind-gauge-wrapper {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-top: -10px;
        }
        .wind-compass { width: 110px; height: 110px; }
        .wind-progress { transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .wind-arrow { transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 50px 50px; }
        .wind-dir-text { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-top: 8px; }

        /* --- HOURLY CARD --- */
        .hourly-header { font-size: 14px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
        .hourly-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hour-item {
            min-width: 64px; text-align: center; padding: 12px 8px; border-radius: 16px;
            background: var(--bg-secondary); border: 1px solid var(--card-border); transition: 0.3s;
        }
        .hour-item:hover { transform: translateY(-4px); border-color: var(--accent); }
        .hour-time { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
        .hour-icon { width: 28px; height: 28px; margin: 0 auto 8px; color: var(--accent); }
        .hour-temp { font-size: 16px; font-weight: 600; color: var(--text-primary); }

        /* --- THEME SWITCHER --- */
        .theme-menu {
            position: absolute; top: 60px; right: 0; background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 8px; backdrop-filter: blur(var(--glass-blur));
            display: none; flex-direction: column; gap: 4px; z-index: 100; min-width: 160px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .theme-menu.active { display: flex; }
        .theme-option {
            padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500;
            display: flex; align-items: center; gap: 10px; transition: 0.2s; color: var(--text-primary);
        }
        .theme-option:hover { background: var(--accent-glow); }
        .theme-dot { width: 12px; height: 12px; border-radius: 50%; }

        /* --- LOADING & ERROR --- */
        .loader { display: none; text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--card-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { display: none; text-align: center; padding: 20px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 16px; color: #ef4444; }
        .controls-wrapper { position: relative; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="controls-wrapper">
            <div class="controls">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--text-secondary)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="searchInput" placeholder="Search city..." value="Tokyo">
                </div>
                <button class="icon-btn" id="geoBtn" title="My Location">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m10-10h-4M6 12H2"/></svg>
                </button>
                <button class="icon-btn" id="themeBtn" title="Themes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>
                </button>
            </div>
            <div class="theme-menu" id="themeMenu">
                <div class="theme-option" data-theme="aurora"><span class="theme-dot" style="background: #38bdf8;"></span> Aurora</div>
                <div class="theme-option" data-theme="solar"><span class="theme-dot" style="background: #f59e0b;"></span> Solar</div>
                <div class="theme-option" data-theme="obsidian"><span class="theme-dot" style="background: #a78bfa;"></span> Obsidian</div>
                <div class="theme-option" data-theme="neon"><span class="theme-dot" style="background: #ec4899;"></span> Neon</div>
            </div>
        </div>

        <div class="loader" id="loader"><div class="spinner"></div>Fetching precise data...</div>
        <div class="error-msg" id="error"></div>

        <div class="bento-grid" id="mainGrid" style="display: none;">
            <!-- Hero Card -->
            <div class="card card-hero">
                <div class="hero-bg" id="heroBg"></div>
                <div class="hero-overlay"></div>
                <div class="unit-toggle">
                    <button class="unit-btn active" id="btnC" onclick="setUnit('C')">°C</button>
                    <button class="unit-btn" id="btnF" onclick="setUnit('F')">°F</button>
                </div>
                <div class="hero-content">
                    <div class="hero-location" id="location">Loading...</div>
                    <div class="hero-date" id="date">Today</div>
                    <div class="hero-temp-row">
                        <div class="hero-temp" id="temp">--°</div>
                        <div class="hero-info">
                            <div class="hero-condition" id="condition">--</div>
                            <div class="hero-feels" id="feels">Feels like --°</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- NEW VISUAL WIND GAUGE CARD -->
            <div class="card card-detail">
                <div class="detail-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
                    Wind
                </div>
                <div class="wind-gauge-wrapper">
                    <svg viewBox="0 0 100 100" class="wind-compass">
                        <!-- Background Track -->
                        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--card-border)" stroke-width="4"/>
                        <!-- Progress Ring (Speed) -->
                        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="4"
                                stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke-linecap="round"
                                transform="rotate(-90 50 50)" class="wind-progress"/>
                        <!-- Direction Markers -->
                        <text x="50" y="18" text-anchor="middle" fill="var(--text-secondary)" font-size="8" font-weight="bold">N</text>
                        <text x="86" y="53" text-anchor="middle" fill="var(--text-secondary)" font-size="8" font-weight="bold">E</text>
                        <text x="50" y="88" text-anchor="middle" fill="var(--text-secondary)" font-size="8" font-weight="bold">S</text>
                        <text x="14" y="53" text-anchor="middle" fill="var(--text-secondary)" font-size="8" font-weight="bold">W</text>
                        <!-- Arrow -->
                        <g class="wind-arrow">
                            <path d="M50 22 L54 50 L50 46 L46 50 Z" fill="var(--accent)"/>
                        </g>
                        <!-- Center Speed Text -->
                        <text x="50" y="54" text-anchor="middle" fill="var(--text-primary)" font-size="14" font-weight="bold" id="windSpeedText">0</text>
                    </svg>
                    <div class="wind-dir-text" id="windDirText">--</div>
                </div>
            </div>

            <div class="card card-detail">
                <div class="detail-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    Humidity
                </div>
                <div class="detail-value" id="humidity">--%</div>
                <div class="detail-sub">Dew point: <span id="dew">--°</span></div>
            </div>

            <div class="card card-detail">
                <div class="detail-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    UV Index
                </div>
                <div class="detail-value" id="uv">--</div>
                <div class="detail-sub" id="uvDesc">--</div>
            </div>

            <div class="card card-detail">
                <div class="detail-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M12 2v20"/></svg>
                    Visibility
                </div>
                <div class="detail-value" id="visibility">-- km</div>
                <div class="detail-sub" id="visDesc">--</div>
            </div>

            <!-- Hourly -->
            <div class="card card-hourly">
                <div class="hourly-header">Hourly Forecast</div>
                <div class="hourly-scroll" id="hourlyScroll"></div>
            </div>
        </div>
    </div>

    <script>
        // --- STATE & CONFIG ---
        let currentUnit = 'C';
        let weatherCache = null;

        const weatherImages = {
            clear: 'https://images.unsplash.com/photo-1621293954908-907159247fc8?w=800&q=80',
            clouds: 'https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=800&q=80',
            rain: 'https://images.unsplash.com/photo-1519692933481-e162a57d6721?w=800&q=80',
            snow: 'https://images.unsplash.com/photo-1491002052546-bf3fa8bbc85e?w=800&q=80',
            fog: 'https://images.unsplash.com/photo-1485233687444-9a8b87b8a3c6?w=800&q=80',
            thunder: 'https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?w=800&q=80'
        };

        const svgIcons = {
            sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>',
            cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
            rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M11 13v4m4-4v4M7 13v4"/></svg>',
            snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M11 14l-2 2m4-2l2 2m-4 2l-2 2m4-2l2 2"/></svg>',
            fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h16M4 10h16M4 18h10"/></svg>',
            thunder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M13 14l-3 5h4l-3 5"/></svg>'
        };

        const wmoMap = {
            0: { img: 'clear', icon: 'sun', desc: 'Clear Sky' },
            1: { img: 'clear', icon: 'sun', desc: 'Mainly Clear' }, 2: { img: 'clouds', icon: 'cloud', desc: 'Partly Cloudy' },
            3: { img: 'clouds', icon: 'cloud', desc: 'Overcast' }, 45: { img: 'fog', icon: 'fog', desc: 'Foggy' }, 48: { img: 'fog', icon: 'fog', desc: 'Rime Fog' },
            51: { img: 'rain', icon: 'rain', desc: 'Light Drizzle' }, 53: { img: 'rain', icon: 'rain', desc: 'Drizzle' }, 55: { img: 'rain', icon: 'rain', desc: 'Dense Drizzle' },
            61: { img: 'rain', icon: 'rain', desc: 'Slight Rain' }, 63: { img: 'rain', icon: 'rain', desc: 'Moderate Rain' }, 65: { img: 'rain', icon: 'rain', desc: 'Heavy Rain' },
            71: { img: 'snow', icon: 'snow', desc: 'Slight Snow' }, 73: { img: 'snow', icon: 'snow', desc: 'Moderate Snow' }, 75: { img: 'snow', icon: 'snow', desc: 'Heavy Snow' },
            80: { img: 'rain', icon: 'rain', desc: 'Rain Showers' }, 95: { img: 'thunder', icon: 'thunder', desc: 'Thunderstorm' }, 96: { img: 'thunder', icon: 'thunder', desc: 'Thunderstorm w/ Hail' }, 99: { img: 'thunder', icon: 'thunder', desc: 'Severe Storm' }
        };

        // --- DOM ELEMENTS ---
        const els = {
            input: document.getElementById('searchInput'), geoBtn: document.getElementById('geoBtn'), themeBtn: document.getElementById('themeBtn'),
            themeMenu: document.getElementById('themeMenu'), loader: document.getElementById('loader'), error: document.getElementById('error'),
            grid: document.getElementById('mainGrid'), heroBg: document.getElementById('heroBg'), location: document.getElementById('location'),
            date: document.getElementById('date'), temp: document.getElementById('temp'), condition: document.getElementById('condition'),
            feels: document.getElementById('feels'), humidity: document.getElementById('humidity'), dew: document.getElementById('dew'), 
            uv: document.getElementById('uv'), uvDesc: document.getElementById('uvDesc'), visibility: document.getElementById('visibility'), 
            visDesc: document.getElementById('visDesc'), hourly: document.getElementById('hourlyScroll'), 
            btnC: document.getElementById('btnC'), btnF: document.getElementById('btnF'),
            // Wind Gauge Elements
            windProgress: document.querySelector('.wind-progress'),
            windArrow: document.querySelector('.wind-arrow'),
            windSpeedText: document.getElementById('windSpeedText'),
            windDirText: document.getElementById('windDirText')
        };

        // --- EVENT LISTENERS ---
        els.input.addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchByCity(els.input.value); });
        els.geoBtn.addEventListener('click', fetchByCoords);
        els.themeBtn.addEventListener('click', (e) => { e.stopPropagation(); els.themeMenu.classList.toggle('active'); });
        document.addEventListener('click', () => els.themeMenu.classList.remove('active'));
        
        document.querySelectorAll('.theme-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.documentElement.setAttribute('data-theme', opt.dataset.theme);
                els.themeMenu.classList.remove('active');
            });
        });

        window.setUnit = function(unit) {
            currentUnit = unit;
            els.btnC.classList.toggle('active', unit === 'C');
            els.btnF.classList.toggle('active', unit === 'F');
            if (weatherCache) updateUI(weatherCache);
        };

        function convertTemp(c) { return currentUnit === 'F' ? Math.round((c * 9/5) + 32) : Math.round(c); }
        function degToDir(d) { const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW']; return dirs[Math.round(d / 22.5) % 16]; }
        function getUvDesc(uv) { if(uv<=2) return 'Low'; if(uv<=5) return 'Moderate'; if(uv<=7) return 'High'; if(uv<=10) return 'Very High'; return 'Extreme'; }
        function getVisDesc(v) { if(v>=10) return 'Perfectly clear'; if(v>=4) return 'Good'; if(v>=1) return 'Moderate'; return 'Poor'; }

        // --- API CALLS ---
        async function fetchByCity(city) {
            if (!city) return; showLoad();
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                const data = await res.json();
                if (!data.results) throw new Error("City not found");
                const { latitude, longitude, name, country } = data.results[0];
                await fetchWeather(latitude, longitude, `${name}, ${country}`);
            } catch (e) { showError(e.message); }
        }

        async function fetchByCoords() {
            if (!navigator.geolocation) return showError("Geolocation not supported");
            showLoad();
            navigator.geolocation.getCurrentPosition(
                async (pos) => await fetchWeather(pos.coords.latitude, pos.coords.longitude, "Your Location"),
                () => showError("Location access denied")
            );
        }

        async function fetchWeather(lat, lon, loc) {
            try {
                // FIXED: Using standard 10m wind parameters for accurate meteorological data
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&daily=uv_index_max,visibility_mean,dew_point_2m_max&timezone=auto`;
                const res = await fetch(url);
                const data = await res.json();
                weatherCache = { ...data, loc };
                updateUI(weatherCache);
                els.grid.style.display = 'grid'; els.loader.style.display = 'none'; els.error.style.display = 'none';
            } catch (e) { showError("Failed to fetch data"); }
        }

        // --- UI UPDATE ---
        function updateUI(data) {
            const c = data.current; const d = data.daily; const h = data.hourly;
            const info = wmoMap[c.weather_code] || { img: 'clear', icon: 'sun', desc: 'Unknown' };

            // Hero
            els.heroBg.style.backgroundImage = `url(${weatherImages[info.img]})`;
            els.location.textContent = data.loc;
            els.date.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            els.temp.textContent = `${convertTemp(c.temperature_2m)}°`;
            els.condition.textContent = info.desc;
            els.feels.textContent = `Feels like ${convertTemp(c.apparent_temperature)}°`;

            // Details
            els.humidity.textContent = `${c.relative_humidity_2m}%`;
            els.dew.textContent = `${convertTemp(d.dew_point_2m_max[0])}°`;
            els.uv.textContent = Math.round(d.uv_index_max[0]);
            els.uvDesc.textContent = getUvDesc(d.uv_index_max[0]);
            
            const visKm = (d.visibility_mean[0] / 1000).toFixed(1);
            els.visibility.textContent = `${visKm} km`;
            els.visDesc.textContent = getVisDesc(parseFloat(visKm));

            // --- NEW WIND GAUGE LOGIC ---
            const speed = c.wind_speed_10m;
            const dir = c.wind_direction_10m;
            const dirText = degToDir(dir);

            // 1. Update Text
            els.windSpeedText.textContent = Math.round(speed);
            els.windDirText.textContent = `${dirText} (${Math.round(dir)}°)`;

            // 2. Animate Progress Ring (Max out visual at 100 km/h)
            const maxSpeed = 100;
            const circumference = 2 * Math.PI * 42; // ~263.89
            const progress = Math.min(speed / maxSpeed, 1);
            const offset = circumference - (progress * circumference);
            els.windProgress.style.strokeDashoffset = offset;

            // 3. Rotate Arrow
            els.windArrow.style.transform = `rotate(${dir}deg)`;

            // Hourly
            els.hourly.innerHTML = '';
            const nowHour = new Date().getHours();
            const startIdx = h.time.findIndex(t => new Date(t).getHours() === nowHour) + 1;
            
            for (let i = startIdx; i < startIdx + 24 && i < h.time.length; i++) {
                const hInfo = wmoMap[h.weather_code[i]] || { icon: 'sun' };
                const time = new Date(h.time[i]).getHours();
                const ampm = time >= 12 ? 'PM' : 'AM';
                const displayTime = time % 12 || 12;
                
                const item = document.createElement('div');
                item.className = 'hour-item';
                item.innerHTML = `
                    <div class="hour-time">${displayTime} ${ampm}</div>
                    <div class="hour-icon">${svgIcons[hInfo.icon]}</div>
                    <div class="hour-temp">${convertTemp(h.temperature_2m[i])}°</div>
                `;
                els.hourly.appendChild(item);
            }
        }

        function showLoad() { els.grid.style.display = 'none'; els.error.style.display = 'none'; els.loader.style.display = 'block'; }
        function showError(msg) { els.loader.style.display = 'none'; els.grid.style.display = 'none'; els.error.style.display = 'block'; els.error.textContent = `❌ ${msg}`; }

        // Init
        fetchByCity('Tokyo');
    </script>
</body>
</html>
